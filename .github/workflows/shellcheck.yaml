name: Shellcheck

# Pushes to main/develop and manual runs: check all shell scripts.
# Pull requests into main/develop: check only the shell scripts changed by the PR.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: perform shellcheck analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run shellcheck
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Shell scripts: by extension or by shebang
          is_shell() {
            local first=""
            [[ $1 =~ \.(sh|bash|bats)$ ]] && return 0
            IFS= read -r first < "$1" || true
            [[ $first =~ ^#!.*[/[:space:]](ba)?sh([[:space:]]|$) ]]
          }

          if [[ $EVENT == pull_request ]]; then
            echo "Checking shell files changed in this PR"
            files=$(git diff --diff-filter=d --name-only "$BASE_SHA...$HEAD_SHA")
          else
            echo "Checking all shell files"
            files=$(git ls-files)
          fi

          rc=0
          checked=0
          while IFS= read -r file; do
            [[ -n $file && -f $file ]] || continue
            is_shell "$file" || continue
            echo "Checking $file ..."
            checked=$((checked + 1))
            shellcheck -- "$file" || rc=1
          done <<< "$files"

          echo "Checked $checked file(s)."
          exit "$rc"
